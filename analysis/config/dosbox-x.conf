[sdl]
fullscreen = false
output = surface
autolock = false
waitonerror = false
mapperfile = analysis/work/dosbox-run/mapper.map

[dosbox]
title = Spacewar1985 bounded investigation
fastbioslogo = true
startbanner = false
quit warning = false
working directory option = noprompt
resolve config path = false
machine = cga
captures = analysis/traces/phase3
memsize = 1

[render]
frameskip = 0
aspect = false
scaler = none

[cpu]
core = normal
cputype = 8086
cycles = fixed 3000
turbo = false

[mixer]
# Silent mode retains device emulation without sending audio to the host.
nosound = true

[midi]
mpu401 = none
mididevice = none

[speaker]
pcspeaker = true
tandy = off
disney = false

[autoexec]
mount c analysis/work/dosbox-run
c:
SPACEWAR.EXE
exit
