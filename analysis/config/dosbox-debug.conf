[sdl]
fullscreen = false
fulldouble = false
output = surface
autolock = false
waitonerror = false
mapperfile = analysis/work/dosbox-run/mapper-debug.map

[dosbox]
machine = cga
captures = analysis/traces/phase3
memsize = 1

[render]
frameskip = 0
aspect = false
scaler = none

[cpu]
core = normal
cputype = auto
cycles = fixed 3000

[mixer]
# Silent mode retains device emulation without sending audio to the host.
nosound = true

[midi]
mpu401 = none
device = none

[sblaster]
sbtype = none

[gus]
gus = false

[speaker]
pcspeaker = true
tandy = off
disney = false

[autoexec]
mount c analysis/work/dosbox-run
c:
pause
SPACEBRK.EXE
exit
